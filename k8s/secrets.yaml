# Shared secrets referenced by every microservice's Deployment via secretKeyRef.
# Replace these values (or better: generate this file with `kubectl create secret generic ...
# --dry-run=client -o yaml` from a local .env that is NOT committed to git) before
# using this anywhere beyond local dev.
apiVersion: v1
kind: Secret
metadata:
  name: smartlogix-secrets
  namespace: smartlogix
type: Opaque
stringData:
  POSTGRES_USER_PASSWORD: userpass123
  POSTGRES_INVENTORY_PASSWORD: inventorypass123
  POSTGRES_ORDERS_PASSWORD: orderspass123
  POSTGRES_RESTOCK_PASSWORD: restockpass123
  # Must stay byte-for-byte identical to the "k" value (base64url-decoded) baked
  # into backend/bff/k8s/configmap.yaml's jwk.json — see that file's comment.
  JWT_SECRET: mySuperSecretKeyForJwtAuthentication123456
