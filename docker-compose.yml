services:
  # ============= DATABASES =============
  postgres-user:
    image: postgres:15-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: userpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - smartlogix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:15-alpine
    container_name: postgres-inventory
    environment:
      POSTGRES_DB: inventorydb
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventorypass123
    ports:
      - "5433:5432"
    volumes:
      - postgres-inventory-data:/var/lib/postgresql/data
    networks:
      - smartlogix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventorydb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-orders:
    image: postgres:15-alpine
    container_name: postgres-orders
    environment:
      POSTGRES_DB: ordersdb
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orderspass123
    ports:
      - "5434:5432"
    volumes:
      - postgres-orders-data:/var/lib/postgresql/data
    networks:
      - smartlogix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d ordersdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-restock:
    image: postgres:15-alpine
    container_name: postgres-restock
    environment:
      POSTGRES_DB: restockdb
      POSTGRES_USER: restock
      POSTGRES_PASSWORD: restockpass123
    ports:
      - "5435:5432"
    volumes:
      - postgres-restock-data:/var/lib/postgresql/data
    networks:
      - smartlogix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restock -d restockdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============= BACKEND MICROSERVICES =============
  ms-user:
    build:
      context: ./backend/ms-user
      dockerfile: Dockerfile
    container_name: ms-user
    ports:
      - "9090:9090"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:5432/userdb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: userpass123
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      smartlogix-network:
        aliases:
          - user-service

  ms-inventory:
    build:
      context: ./backend/ms-inventory
      dockerfile: Dockerfile
    container_name: ms-inventory
    ports:
      - "9091:9091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-inventory:5432/inventorydb
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventorypass123
      INVENTORY_SERVICE_URL: http://ms-inventory:9091
    depends_on:
      postgres-inventory:
        condition: service_healthy
    networks:
      smartlogix-network:
        aliases:
          - inventory-service

  ms-orders:
    build:
      context: ./backend/ms-orders
      dockerfile: Dockerfile
    container_name: ms-orders
    ports:
      - "9092:9092"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-orders:5432/ordersdb
      SPRING_DATASOURCE_USERNAME: orders
      SPRING_DATASOURCE_PASSWORD: orderspass123
      ORDERS_SERVICE_URL: http://ms-orders:9092
    depends_on:
      postgres-orders:
        condition: service_healthy
    networks:
      smartlogix-network:
        aliases:
          - orders-service

  ms-restock:
    build:
      context: ./backend/ms-restock
      dockerfile: Dockerfile
    container_name: ms-restock
    ports:
      - "9093:9093"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-restock:5432/restockdb
      SPRING_DATASOURCE_USERNAME: restock
      SPRING_DATASOURCE_PASSWORD: restockpass123
      RESTOCK_SERVICE_URL: http://ms-restock:9093
      INVENTORY_SERVICE_URL: http://inventory-service:9091
    depends_on:
      postgres-restock:
        condition: service_healthy
    networks:
      smartlogix-network:
        aliases:
          - restock-service

  # ============= BFF (KRAKEND API GATEWAY) =============
  bff:
    build:
      context: ./backend/bff
      dockerfile: Dockerfile
    container_name: bff
    ports:
      - "8080:8080"
    depends_on:
      - ms-user
      - ms-inventory
      - ms-orders
      - ms-restock
    networks:
      - smartlogix-network

  # ============= FRONTEND =============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - bff
    networks:
      - smartlogix-network

networks:
  smartlogix-network:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-inventory-data:
  postgres-orders-data:
  postgres-restock-data: