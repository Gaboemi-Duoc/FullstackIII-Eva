apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: smartlogix
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # IMPORTANT: rebuild this image with
          #   --build-arg VITE_BFF_URL=http://api.smartlogix.local
          # (or whatever host you point the Ingress at below) BEFORE deploying.
          # Vite bakes VITE_BFF_URL into the static JS at build time -- changing
          # it here at runtime has no effect on an already-built image.
          image: smartlogix/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
