apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-orders
  namespace: smartlogix
  labels:
    app: postgres-orders
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-orders
  template:
    metadata:
      labels:
        app: postgres-orders
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "ordersdb"
            - name: POSTGRES_USER
              value: "orders"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartlogix-secrets
                  key: POSTGRES_ORDERS_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "orders", "-d", "ordersdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "orders", "-d", "ordersdb"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-orders-pvc
