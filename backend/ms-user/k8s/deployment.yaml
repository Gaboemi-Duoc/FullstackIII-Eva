apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-user
  namespace: smartlogix
  labels:
    app: ms-user
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-user
  template:
    metadata:
      labels:
        app: ms-user
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-user -p 5432 -U user; do
                echo "waiting for postgres-user...";
                sleep 2;
              done
      containers:
        - name: ms-user
          # Build & push this image from ./backend/ms-user, or load it directly
          # into your local cluster (kind load docker-image / minikube image load).
          image: smartlogix/ms-user:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-user:5432/userdb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "user"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartlogix-secrets
                  key: POSTGRES_USER_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smartlogix-secrets
                  key: JWT_SECRET
          readinessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9090
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 750m
              memory: 768Mi
