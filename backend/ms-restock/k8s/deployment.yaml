apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-restock
  namespace: smartlogix
  labels:
    app: ms-restock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-restock
  template:
    metadata:
      labels:
        app: ms-restock
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:15-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres-restock -p 5432 -U restock; do
                echo "waiting for postgres-restock...";
                sleep 2;
              done
      containers:
        - name: ms-restock
          # Build & push this image from ./backend/ms-restock, or load it directly
          # into your local cluster (kind load docker-image / minikube image load).
          image: smartlogix/ms-restock:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9093
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-restock:5432/restockdb"
            - name: SPRING_DATASOURCE_USERNAME
              value: "restock"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smartlogix-secrets
                  key: POSTGRES_RESTOCK_PASSWORD
            - name: INVENTORY_SERVICE_URL
              value: "http://inventory-service:9091"
          readinessProbe:
            tcpSocket:
              port: 9093
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9093
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
