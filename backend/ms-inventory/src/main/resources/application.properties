spring.application.name=inventory-service
server.port=9091

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/inventorydb
spring.datasource.username=inventory
spring.datasource.password=inventorypass123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true

spring.jpa.defer-datasource-initialization=true


# SENTRY / GLITCHTIP CONFIGURATION
sentry.dsn=https://eb715c4fc99e4e0bb9661e8d658f676f@app.glitchtip.com/25295
sentry.environment=production
sentry.release=ms-inventory@1.0.0
sentry.traces-sample-rate=0.01
# sentry.debug=true

sentry.logs.enabled=true
sentry.logging.enabled=true
sentry.logging.minimum-level=info
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=debug

sentry.tags.application=bff
sentry.tags.service=smartlogix-bff

logging.level.com.smartlogix.bff=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springdoc=DEBUG
logging.level.io.sentry=DEBUG